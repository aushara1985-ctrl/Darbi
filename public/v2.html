  // ── Recommendation: picks one template id from diagnosis + draft signals.
  function v2RecommendTemplate(diagnosis, draft){
    var facts = (diagnosis && diagnosis.cvFacts) || {};
    var track = (draft && draft.track) || '';
    // Branch A or simple_job track → One-Pager
    if ((diagnosis && diagnosis.branch === 'A') || track === 'simple_job') return 'one_pager_basic';
    // Senior leadership signals → Executive Brief
    if (diagnosis && diagnosis.isSeniorOverride) return 'executive_brief';
    if (track === 'leadership' && facts.yearsExp && facts.yearsExp >= 8) return 'executive_brief';
    // Achievement-Focused when CV contains real numbers AND seniority is mid+
    var cvHasMetrics = !!(diagnosis && diagnosis.cvText && /\d+%|\d+m\s*(sar|usd|aed|arr)|arr|mrr|nrr/i.test(diagnosis.cvText));
    if (cvHasMetrics && facts.yearsExp && facts.yearsExp >= 3) return 'achievement_focused';
    // Fresh grad or junior → Fresh Graduate
    if (track === 'junior_fresh' || (facts.yearsExp != null && facts.yearsExp < 2)) return 'fresh_graduate';
    if (diagnosis && diagnosis.branch === 'B') return 'fresh_graduate';
    // Default
    return 'ats_optimized';
  }

  // ── Section builder helpers ───────────────────────────────────────────
  function _ph(text){ return '<span class="v2-cvb-placeholder">[' + escapeHtml(text) + ']</span>'; }
  function _phPlain(text){ return '[' + text + ']'; }
  function _list(items, fn){ return '<ul>' + items.map(fn).join('') + '</ul>'; }
  function _listPlain(items){ return items.map(function(x){ return '• ' + x; }).join('\n'); }

  function _famKey(diagnosis){
    var f = diagnosis && diagnosis.family;
    if (f && V2_FAMILY_BULLETS[f]) return f;
    return 'admin_office'; // safe neutral fallback
  }
  function _seniorityBand(diagnosis, facts){
    if (diagnosis && diagnosis.isSeniorOverride) return 'senior';
    if (facts && facts.yearsExp && facts.yearsExp >= 5) return 'senior';
    if (diagnosis && diagnosis.branch === 'C') return 'senior';
    return 'junior';
  }
  function _famBullets(diagnosis, facts){
    var fam = _famKey(diagnosis);
    var band = _seniorityBand(diagnosis, facts);
    return (V2_FAMILY_BULLETS[fam] && V2_FAMILY_BULLETS[fam][band]) || V2_FAMILY_BULLETS.admin_office[band];
  }
  function _famSkills(diagnosis, facts){
    var fam = _famKey(diagnosis);
    var cvTools = (facts && Array.isArray(facts.tools)) ? facts.tools : [];
    var famSkills = V2_FAMILY_SKILLS[fam] || [];
    var merged = [];
    cvTools.forEach(function(t){ if (merged.indexOf(t) === -1) merged.push(t); });
    famSkills.forEach(function(s){ if (merged.indexOf(s) === -1 && merged.length < 10) merged.push(s); });
    return merged;
  }

  // ── Build a template by id. Reads Diagnosis + V2Draft + cvFacts. ──────
  function v2GenerateCv(templateId, diagnosis){
    var tpl = V2_CV_TEMPLATES[templateId];
    if (!tpl) return null;
    var draft = V2Draft.get();
    var facts = (diagnosis && diagnosis.cvFacts) || extractCvFacts(diagnosis && diagnosis.cvText || draft.cvText || '');
    var fn = window[tpl.genFn];
    if (typeof fn !== 'function') return null;
    return Object.assign({ id: templateId }, fn(diagnosis, facts || {}, draft));
  }

  // ── Read ?t= from current hash ────────────────────────────────────────
  function v2HashParam(name){
    var h = location.hash || '';
    var qIdx = h.indexOf('?');
    if (qIdx === -1) return null;
    var params = h.slice(qIdx + 1).split('&');
    for (var i = 0; i < params.length; i++) {
      var kv = params[i].split('=');
      if (decodeURIComponent(kv[0]) === name) return decodeURIComponent(kv[1] || '');
    }
    return null;
  }

  // ── #/cv-builder renderer ─────────────────────────────────────────────
  function renderCvBuilder(app, route){
    var d = Diagnosis.get();
    if (!d) { v2Go('#/cv-templates'); return; }
    var draft = V2Draft.get();
    var templateId = v2HashParam('t') || v2RecommendTemplate(d, draft);
    var saved = V2Cv.get();
    // If a previous save exists for the SAME template id, restore its edits.
    var edits = (saved && saved.templateId === templateId && saved.sections) ? saved.sections : {};

    function paint(){
      var cv = v2GenerateCv(templateId, d);
      if (!cv) {
        app.innerHTML = '<div class="v2-dx-error"><span>⚠</span><div>قالب غير معروف.</div></div>';
        return;
      }
      // Apply edits on top of generated content.
      var sectionsHtml = cv.sections.map(function(s){
        var html = (edits[s.id] && edits[s.id].html) || s.html;
        return ''
          + '<div class="v2-cvb-section" data-section-id="' + escapeHtml(s.id) + '">'
          +   '<div class="v2-cvb-section-h">' + escapeHtml(s.title)
          +     '<button class="v2-cvb-section-edit" onclick="v2CvbEditSection(\'' + escapeHtml(s.id) + '\')">✏️ تعديل</button>'
          +   '</div>'
          +   '<div class="v2-cvb-section-body" data-section-body="' + escapeHtml(s.id) + '">' + html + '</div>'
          + '</div>';
      }).join('');
      var hasSaved = !!(saved && saved.templateId === templateId);
      app.innerHTML = ''
        + '<div class="v2-cvb-toolbar">'
        +   '<div class="v2-cvb-toolbar-info">قالب: <b>' + escapeHtml(V2_CV_TEMPLATES[templateId].ar) + '</b>' + (hasSaved ? '<span class="v2-cvb-saved-status">✓ محفوظة</span>' : '') + '</div>'
        +   '<button class="v2-cvb-toolbar-btn is-primary" onclick="v2CvbCopy(\'html\')">📋 نسخ HTML</button>'
        +   '<button class="v2-cvb-toolbar-btn" onclick="v2CvbCopy(\'plain\')">📋 نسخ نص عادي</button>'
        +   '<button class="v2-cvb-toolbar-btn" onclick="v2CvbSave()">💾 حفظ</button>'
        + '</div>'
        + '<div class="v2-cvb-honest">هذي صياغة مقترحة من التشخيص. <strong>راجعها قبل الإرسال.</strong> العناصر بين أقواس [...] تحتاج تعبئة من بياناتك الحقيقية. لا تخترع أرقام أو شركات أو شهادات.</div>'
        + '<div class="v2-cvb-preview" id="v2CvbPreview">' + sectionsHtml + '</div>'
        // Edit modal
        + '<div class="v2-cvb-edit-modal" id="v2CvbEditModal">'
        +   '<div class="v2-cvb-edit-card">'
        +     '<div class="v2-cvb-edit-h" id="v2CvbEditTitle">تعديل القسم</div>'
        +     '<div class="v2-cvb-edit-hint">حرّر المحتوى. تقدر تستخدم HTML بسيط (<b>, <i>, <ul>, <li>). الأقواس [...] تحتاج تعبئة من بياناتك.</div>'
        +     '<textarea class="v2-cvb-edit-textarea" id="v2CvbEditTextarea"></textarea>'
        +     '<div class="v2-cvb-edit-actions">'
        +       '<button class="v2-btn v2-btn-primary" onclick="v2CvbEditApply()">حفظ التعديل</button>'
        +       '<button class="v2-btn v2-btn-secondary" onclick="v2CvbEditCancel()">إلغاء</button>'
        +     '</div>'
        +   '</div>'
        + '</div>';
    }

    // Stash everything onto window so the action handlers can find it.
    window.__v2Cvb = {
      templateId: templateId,
      diagnosis: d,
      edits: edits,
      currentEditId: null,
      get cv(){ return v2GenerateCv(this.templateId, this.diagnosis); },
      repaint: paint,
    };
    paint();

  function v2CvbEditSection(sectionId){
    var s = window.__v2Cvb;
    if (!s) return;
    var cv = s.cv;
    var section = (cv && cv.sections.find(function(x){ return x.id === sectionId; })) || null;
    if (!section) return;
    var current = (s.edits[sectionId] && s.edits[sectionId].html) || section.html;
    s.currentEditId = sectionId;
    document.getElementById('v2CvbEditTitle').textContent = 'تعديل: ' + section.title;
    document.getElementById('v2CvbEditTextarea').value = current;
    document.getElementById('v2CvbEditModal').classList.add('is-open');
  }
  function v2CvbEditApply(){
    var s = window.__v2Cvb;
    if (!s || !s.currentEditId) return;
    var newHtml = document.getElementById('v2CvbEditTextarea').value || '';
    s.edits[s.currentEditId] = { html: newHtml };
    v2CvbEditCancel();
    s.repaint();
  }
  function v2CvbEditCancel(){
    var s = window.__v2Cvb;
    if (s) s.currentEditId = null;
    var m = document.getElementById('v2CvbEditModal');
    if (m) m.classList.remove('is-open');
  }
  function v2CvbSave(){
    var s = window.__v2Cvb;
    if (!s) return;
    V2Cv.save({ templateId: s.templateId, sections: s.edits });
    if (typeof DarbiJourney !== 'undefined' && DarbiJourney.markCvAuditDone) DarbiJourney.markCvAuditDone();
    s.repaint();
  }
  function v2CvbCopy(mode){
    var s = window.__v2Cvb;
    if (!s) return;
    var cv = s.cv;
    if (!cv) return;
    var out;
    if (mode === 'html') {
      out = cv.sections.map(function(sec){
        var html = (s.edits[sec.id] && s.edits[sec.id].html) || sec.html;
        return '<h3>' + sec.title + '</h3>\n' + html;
      }).join('\n\n');
    } else {
      // Plain text: strip HTML tags from any edited section to get a clean
      // plaintext export. Falls back to the generator's plain field for
      // unedited sections.
      out = cv.sections.map(function(sec){
        var html = s.edits[sec.id] && s.edits[sec.id].html;
        var plain;
        if (html != null) plain = html.replace(/<[^>]+>/g, '').replace(/\s+\n/g, '\n').trim();
        else plain = sec.plain;
        return '== ' + sec.title + ' ==\n' + plain;
      }).join('\n\n');
    }
    var done = function(){
      // First successful copy = "cv audit done" milestone for journey routing.
      if (typeof DarbiJourney !== 'undefined' && DarbiJourney.markCvAuditDone) DarbiJourney.markCvAuditDone();
      alert('✓ تم النسخ. الصق سيرتك في Word أو Google Docs.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(out).then(done).catch(done);
    } else { done(); }
  }

  // ════════════════════════════════════════════════════════════════════════
  // PHASE 1 TASK 5 — Jobs screen (#/jobs)
  // Reads Diagnosis + V2Draft + saved V2 CV + journey state.
  // POSTs to existing /api/jobs/search (same endpoint V1 uses).
  // Renders live cards OR honest fallback (target titles + LinkedIn/Bayt/
  // Google search links). NEVER fakes jobs. NO PDF / Premium / coming-soon.
  // ════════════════════════════════════════════════════════════════════════

  // Shared cache key with V1 JobsUI so users moving V1 ↔ V2 see same state.
  var V2_JOBS_CACHE_KEY = 'darbi_jobs_cache_v1';
  function _v2JobsCacheRead(){
    try { return JSON.parse(localStorage.getItem(V2_JOBS_CACHE_KEY) || 'null'); }
    catch(e){ return null; }
  }
  function _v2JobsCacheWrite(data){
    try { localStorage.setItem(V2_JOBS_CACHE_KEY, JSON.stringify({ at: Date.now(), data: data })); } catch(e){}
  }
  function _v2JobsCacheClear(){ try { localStorage.removeItem(V2_JOBS_CACHE_KEY); } catch(e){} }

  // Dismissed jobs (per session) — "ليست مناسبة" hides locally.
  var V2_DISMISSED_JOBS = {};
  function _v2DismissJob(jobId){ if (jobId) V2_DISMISSED_JOBS[jobId] = 1; }
  function _v2IsDismissed(jobId){ return !!V2_DISMISSED_JOBS[jobId]; }

  // Build the request body. Uses Diagnosis (canonical, written by Task 3)
  // for dreamRole / family / cvText / cvFacts / seniority hints.
  function _v2JobsBuildRequest(diagnosis, location, limit){
    if (!diagnosis) return null;
    return {
      dreamRole: diagnosis.dreamRole || '',
      diagnosis: {
        family: diagnosis.family || null,
        intent: diagnosis.intent || null,
        isSeniorOverride: !!diagnosis.isSeniorOverride,
      },
      cvFacts: diagnosis.cvFacts || null,
      cvText:  diagnosis.cvText  || null,
      location: location || null,
      limit:    limit || 10,
    };
  }

  async function v2JobsFetch(diagnosis, location){
    var body = _v2JobsBuildRequest(diagnosis, location, 10);
    if (!body) return { success: false, error: 'no_diagnosis' };
    try {
      var r = await fetch('/api/jobs/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        if (r.status === 429) return { success: false, error: 'rate_limit' };
        return { success: false, error: 'http_' + r.status };
      }
      var data = await r.json();
      if (data && data.success) {
        _v2JobsCacheWrite(data);
        if (typeof DarbiBrain !== 'undefined') DarbiBrain.learn({ type: 'jobs_searched', mode: data.mode, count: (data.jobs||[]).length });
      }
      return data;
    } catch(e) {
      return { success: false, error: 'network' };
    }
  }

  function _v2MatchClass(score){
    if (score >= 60) return '';
    if (score >= 35) return 'is-mid';
    return 'is-low';
  }
  function _v2SourceLabel(src){
    return {
      greenhouse:'Greenhouse', lever:'Lever', ashby:'Ashby',
      workable:'Workable', smartrecruiters:'SmartRecruiters',
      jsearch:'JSearch', adzuna:'Adzuna', jooble:'Jooble',
      serpapi:'Google Jobs', theirstack:'TheirStack',
    }[src] || src || '';
  }

  function _v2JobsRenderCard(j, idx){
    var score = (j.match && j.match.score) || 0;
    var matchCls = _v2MatchClass(score);
    var flags = (j.match && j.match.flags) || [];
    var flagsHtml = flags.length
      ? '<div class="v2-job-flags">' + flags.map(function(f){
          return '<span class="v2-job-flag">' + escapeHtml(f.ar || f.key) + '</span>';
        }).join('') + '</div>'
      : '';
    var why = (j.whyMatched || []).map(escapeHtml).join(' · ');
    var openHref = j.applyUrl || j.url || '#';
    var safeId = escapeHtml(j.id || ('job-' + idx));
    var safePayload = encodeURIComponent(JSON.stringify({
      id: j.id, title: j.title, company: j.company, url: openHref, source: j.source,
    }));
    return ''
      + '<div class="v2-job-card' + (score < 35 ? ' is-low' : '') + '" data-job-id="' + safeId + '">'
      +   '<div class="v2-job-row1">'
      +     '<div class="v2-job-title">' + escapeHtml(j.title || '—') + '</div>'
      +     '<span class="v2-job-match ' + matchCls + '">' + Math.round(score) + '٪</span>'
      +   '</div>'
      +   '<div class="v2-job-row2">'
      +     '<span class="v2-job-meta-tag">🏢 ' + escapeHtml(j.company || '—') + '</span>'
      +     (j.location ? '<span class="v2-job-meta-tag">📍 ' + escapeHtml(j.location) + '</span>' : '')
      +     (j.source ? '<span class="v2-job-source">' + escapeHtml(_v2SourceLabel(j.source)) + '</span>' : '')
      +   '</div>'
      +   (why ? '<div class="v2-job-why">✓ ' + why + '</div>' : '')
      +   (j.cvFixTip ? '<div class="v2-job-tip">💡 ' + escapeHtml(j.cvFixTip) + '</div>' : '')
      +   flagsHtml
      +   '<div class="v2-job-ctas">'
      +     '<button class="v2-job-cta is-primary" onclick="v2JobsApply(\'' + safePayload + '\')">جهّز تقديمي ←</button>'
      +     '<a class="v2-job-cta" href="' + escapeHtml(openHref) + '" target="_blank" rel="noopener" onclick="v2JobsOpen(\'' + safePayload + '\')">افتح الوظيفة</a>'
      +     '<button class="v2-job-cta" onclick="v2JobsNotFit(\'' + safePayload + '\')">ليست مناسبة</button>'
      +   '</div>'
      + '</div>';
  }

  // Honest fallback — surfaces the family target titles + search links
  // (LinkedIn / Bayt / Google Jobs). NEVER renders fake job cards.
  function _v2JobsRenderFallback(fb){
    if (!fb) return '';
    var titles = (fb.targetTitles || []).map(escapeHtml);
    var links = fb.searchLinks || [];
    var titlesHtml = titles.length
      ? '<div class="v2-jobs-fb-h">مسميات بحث جاهزة</div><ul class="v2-jobs-fb-titles">' +
        titles.map(function(t){ return '<li>' + t + '</li>'; }).join('') + '</ul>'
      : '';
    var linksHtml = links.length
      ? '<div class="v2-jobs-fb-search">' + links.map(function(l){
          return '<div class="v2-jobs-fb-search-row">' +
            '<b>' + escapeHtml(l.label) + '</b>' +
            (l.linkedin ? '<a class="v2-jobs-fb-link" target="_blank" rel="noopener" href="' + escapeHtml(l.linkedin) + '">LinkedIn</a>' : '') +
            (l.bayt     ? '<a class="v2-jobs-fb-link" target="_blank" rel="noopener" href="' + escapeHtml(l.bayt)     + '">Bayt</a>'     : '') +
            (l.google   ? '<a class="v2-jobs-fb-link" target="_blank" rel="noopener" href="' + escapeHtml(l.google)   + '">Google Jobs</a>'   : '') +
            '</div>';
        }).join('') + '</div>'
      : '';
    return ''
      + '<div class="v2-jobs-fb">'
      +   '<strong style="color:#0a0a0a">' + escapeHtml(fb.message || 'البحث التلقائي غير مفعّل حالياً. هذه روابط بحث جاهزة حسب هدفك.') + '</strong>'
      +   titlesHtml + linksHtml
      + '</div>';
  }

  function _v2JobsPaint(app, data, locationVal){
    var diagnosis = Diagnosis.get();
    var dreamRole = (diagnosis && diagnosis.dreamRole) || '';
    var barHtml = ''
      + '<div class="v2-jobs-bar">'
      +   '<span class="v2-jobs-bar-label">المدينة:</span>'
      +   '<input type="text" class="v2-jobs-bar-input" id="v2JobsLocation" placeholder="مثال: الرياض، Remote" value="' + escapeHtml(locationVal || '') + '" />'
      +   '<button class="v2-jobs-bar-refresh" onclick="v2JobsRefresh()">🔄 بحث جديد</button>'
      + '</div>';

    if (!data) {
      app.innerHTML = barHtml +
        '<div class="v2-jobs-loading"><div class="v2-dx-loading-spin"></div>' +
        '<div class="v2-dx-loading-text">نبحث في صفحات وظائف الشركات...</div>' +
        '<div class="v2-dx-loading-sub">ثواني فقط</div></div>';
      return;
    }
    if (!data.success) {
      var msg = data.error === 'rate_limit'
        ? 'بحثت كثير في وقت قصير. جرّب بعد دقيقة.'
        : (data.error === 'network' ? 'ما قدرنا نوصل للسيرفر. تأكد إن الانترنت شغّال.' : 'حصل خطأ. حاول مرة أخرى.');
      app.innerHTML = barHtml + '<div class="v2-jobs-error"><span>⚠</span><div>' + escapeHtml(msg) + '</div></div>';
      return;
    }

    // Live mode + jobs present → cards.
    if (data.mode === 'live' && Array.isArray(data.jobs) && data.jobs.length) {
      var visibleJobs = data.jobs.filter(function(j){ return !_v2IsDismissed(j.id); });
      var cardsHtml = visibleJobs.map(_v2JobsRenderCard).join('');
      var sourcesUsedHtml = (data.sourcesUsed && data.sourcesUsed.length)
        ? '<span class="v2-jobs-mode-pill">live · ' + escapeHtml(data.sourcesUsed.map(function(s){ return s.provider || s.company; }).join(', ')) + '</span>'
        : '<span class="v2-jobs-mode-pill">live</span>';
      app.innerHTML = barHtml
        + '<div class="v2-jobs-meta">لقينا لك <b>' + visibleJobs.length + '</b> وظيفة مناسبة لـ <b>' + escapeHtml(dreamRole) + '</b> ' + sourcesUsedHtml + '</div>'
        + cardsHtml;
      return;
    }
    // Live mode but zero jobs → no-results state.
    if (data.mode === 'live') {
      app.innerHTML = barHtml +
        '<div class="v2-jobs-empty">ما لقينا وظائف مناسبة الآن لـ <b>' + escapeHtml(dreamRole) + '</b>. جرّب توسيع المدينة أو الرجوع لاحقاً.</div>';
      return;
    }
    // Fallback mode — honest message + target titles + search links. NO
    // fake job cards. NO "جهّز تقديمي" — there's nothing real to prepare for.
    app.innerHTML = barHtml
      + '<div class="v2-jobs-meta">هدفك: <b>' + escapeHtml(dreamRole) + '</b> <span class="v2-jobs-mode-pill is-fallback">fallback</span></div>'
      + _v2JobsRenderFallback(data.fallback);
  }

  // ── #/jobs renderer ───────────────────────────────────────────────────
  async function renderJobs(app, route){
    var d = Diagnosis.get();
    if (!d) {
      app.innerHTML = '<div class="v2-empty-state"><div class="v2-empty-emoji">📝</div><h3>اكمل التشخيص أولاً</h3>'
        + '<p>نحتاج تشخيصك عشان نقترح وظائف تناسب وضعك.</p>'
        + '<button class="v2-btn v2-btn-primary" onclick="v2Go(\'#/track\')">ابدأ التشخيص ←</button></div>';
      return;
    }
    var draft = V2Draft.get();
    var locationVal = (draft && draft.location) || '';

    // Try cache first (≤30 min, same dreamRole as current diagnosis).
    var cached = _v2JobsCacheRead();
    var fresh = cached && (Date.now() - cached.at < 30 * 60 * 1000)
      && cached.data && cached.data.searchProfile
      && cached.data.searchProfile.dreamRole === d.dreamRole;
    if (fresh) {
      _v2JobsPaint(app, cached.data, locationVal);
      if (typeof DarbiJourney !== 'undefined' && DarbiJourney.markJobsViewed) DarbiJourney.markJobsViewed();
      return;
    }

    // Live fetch.
    _v2JobsPaint(app, null, locationVal); // loading state
    var data = await v2JobsFetch(d, locationVal);
    _v2JobsPaint(app, data, locationVal);
    // Mark jobs viewed on first successful render (live OR fallback both
    // count — the user has been shown jobs guidance).
    if (data && data.success && typeof DarbiJourney !== 'undefined' && DarbiJourney.markJobsViewed) {
      DarbiJourney.markJobsViewed();
    }
  }

  // Manual refresh button — reads the location input + invalidates cache.
  async function v2JobsRefresh(){
    var app = document.getElementById('v2-app');
    var locInput = document.getElementById('v2JobsLocation');
    var locationVal = locInput ? locInput.value.trim() : '';
    V2Draft.set({ location: locationVal });
    _v2JobsCacheClear();
    var d = Diagnosis.get();
    if (!d) return;
    _v2JobsPaint(app, null, locationVal);
    var data = await v2JobsFetch(d, locationVal);
    _v2JobsPaint(app, data, locationVal);
    if (data && data.success && typeof DarbiJourney !== 'undefined' && DarbiJourney.markJobsViewed) {
      DarbiJourney.markJobsViewed();
    }
  }

  // Job card action: "جهّز تقديمي" — routes to #/apply with the job context.
  // The #/apply screen is still a placeholder in this task; Task 6 builds it.
  function v2JobsApply(payloadEnc){
    try {
      var p = JSON.parse(decodeURIComponent(payloadEnc));
      if (typeof DarbiBrain !== 'undefined') DarbiBrain.learn({ type: 'apply_started', job: p });
      // Stash the selected job so #/apply can read it without re-fetching.
      try { localStorage.setItem('darbi_v2_selected_job', JSON.stringify(p)); } catch(e){}
      v2Go('#/apply?j=' + encodeURIComponent(p.id || ''));
    } catch(e){}
  }

  // Job card action: "افتح الوظيفة" — anchor opens in new tab; we record
  // the event + advance journey.
  function v2JobsOpen(payloadEnc){
    try {
      var p = JSON.parse(decodeURIComponent(payloadEnc));
      if (typeof DarbiBrain !== 'undefined') DarbiBrain.learn({ type: 'job_opened', job: p });
    } catch(e){}
  }

  // Job card action: "ليست مناسبة" — local hide + DarbiBrain.learn for
  // future ranking signal.
  function v2JobsNotFit(payloadEnc){
    try {
      var p = JSON.parse(decodeURIComponent(payloadEnc));
      _v2DismissJob(p.id);
      if (typeof DarbiBrain !== 'undefined') DarbiBrain.learn({ type: 'job_dismissed', job: p });
      var card = document.querySelector('[data-job-id="' + (p.id || '') + '"]');
      if (card && card.parentNode) card.parentNode.removeChild(card);
    } catch(e){}
  }

  // ════════════════════════════════════════════════════════════════════════
  // PHASE 1 TASK 6 — Apply Package (#/apply)
  // Generates tailored summary + CV adjustments + cover letter + checklist
  // for ONE specific job. Reuses V2_FAMILY_BULLETS / V2_FAMILY_SKILLS from
  // Task 4. Metrics (ARR/NRR/team size) ONLY when regex-detected in actual
  // cvText. Cover letter language flips AR ↔ EN based on job title script.
  // ════════════════════════════════════════════════════════════════════════

  // ── Selected-job resolution ───────────────────────────────────────────
  function v2GetSelectedJob(){
    // 1. Try the explicit stash set by v2JobsApply().
    try {
      var raw = localStorage.getItem('darbi_v2_selected_job');
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.id) return parsed;
      }
    } catch(e){}
    // 2. Fall back to ?j= from the current hash + lookup in cache.
    var jid = v2HashParam('j');
    if (jid) {
      try {
        var cache = JSON.parse(localStorage.getItem(V2_JOBS_CACHE_KEY) || 'null');
        if (cache && cache.data && Array.isArray(cache.data.jobs)) {
          for (var i = 0; i < cache.data.jobs.length; i++) {
            if (cache.data.jobs[i].id === jid) return cache.data.jobs[i];
          }
        }
      } catch(e){}
    }
    return null;
  }

  // ── English-title detection (for cover letter language) ───────────────
  function _v2IsEnglishTitle(t){
    var s = (t || '').trim();
    if (!s) return false;
    return !/[؀-ۿ]/.test(s);
  }

  // ── Match-summary "why this job suits you" ────────────────────────────
  function _v2APBuildMatchSummary(job, diagnosis, facts, band){
    var family = diagnosis.family || 'unknown';
    var fam = DREAM_ROLE_LIBRARY[family];
    var bullets = [];
    if (job.whyMatched && job.whyMatched.length) {
      bullets = bullets.concat(job.whyMatched.slice(0, 3));
    }
    if (facts.tools && facts.tools.length) {
      var sharedTools = facts.tools.slice(0, 3);
      bullets.push('أدواتك (' + sharedTools.join('، ') + ') مذكورة في سيرتك — أبرزها في التقديم.');
    }
    if (band === 'senior' && facts.yearsExp) {
      bullets.push(facts.yearsExp + ' سنوات خبرة في المجال = ميزة قوية لهذا الدور.');
    }
    if (band === 'junior' && (facts.projectsEvidence || facts.major)) {
      bullets.push('مشاريعك/تخصصك يمكن استخدامها كدليل عملي بدل سنوات الخبرة.');
    }
    if (!bullets.length) {
      bullets.push('هذا الدور قريب من ' + (fam ? fam.familyAr : 'مسارك') + ' — جوابك في الـ quiz يدل على أنه ضمن دائرة استهدافك.');
    }
    // Risk flags from ranker (if any).
    var risks = [];
    if (job.match && Array.isArray(job.match.flags) && job.match.flags.length) {
      job.match.flags.slice(0, 2).forEach(function(f){
        risks.push(f.ar || f.key);
      });
    }
    return { bullets: bullets, risks: risks };
  }

  // ── CV adjustments — family + seniority + job keywords ────────────────
  function _v2APBuildCvAdjustments(job, diagnosis, facts, band){
    var family = diagnosis.family || 'admin_office';
    var bullets = (V2_FAMILY_BULLETS[family] && V2_FAMILY_BULLETS[family][band === 'senior' ? 'senior' : 'junior']) || V2_FAMILY_BULLETS.admin_office.junior;
    // Show 3-4 family-aware adjustment bullets.
    var picks = bullets.slice(0, 4);
    // Keywords to add — merge cvFacts.tools + family skills, capped.
    var famSkills = V2_FAMILY_SKILLS[family] || [];
    var cvTools = (facts.tools || []);
    var allKw = [];
    famSkills.forEach(function(k){ if (allKw.indexOf(k) === -1) allKw.push(k); });
    cvTools.forEach(function(k){ if (allKw.indexOf(k) === -1) allKw.push(k); });
    // Missing-from-CV scan: anything in family skills NOT in cvText is "missing".
    var cvLow = (diagnosis.cvText || '').toLowerCase();
    var missing = famSkills.filter(function(k){ return cvLow.indexOf(k.toLowerCase()) === -1; }).slice(0, 5);
    var present = famSkills.filter(function(k){ return cvLow.indexOf(k.toLowerCase()) !== -1; }).slice(0, 5);
    // Also surface the user's ACTUAL extracted tools (React, Node, Excel, etc.)
    // — these are guaranteed to be in CV (extractCvFacts pulled them out) and
    // are highest-signal for the family-aware family lookup to miss them.
    (facts.tools || []).forEach(function(t){
      if (present.indexOf(t) === -1 && present.length < 8) present.push(t);
    });
    // Senior + ARR/NRR mention only if actually in CV.
    var arrMatch = (diagnosis.cvText || '').match(/(\d{1,3})\s*(?:m|mm)\s*(?:sar|usd|aed|arr)/i);
    var seniorMetricLine = (band === 'senior' && arrMatch) ? ('أبرز ' + arrMatch[0] + ' في الملخص المهني (السطر الأول، قبل أي شي تاني).') : null;
    return { picks: picks, present: present, missing: missing, seniorMetricLine: seniorMetricLine };
  }

  // ── Cover letter — AR by default, EN if job title is purely Latin ─────
  function _v2APBuildCoverLetter(job, diagnosis, facts, band){
    var dreamRole = diagnosis.dreamRole || job.title || 'الدور المستهدف';
    var company = job.company || '[الشركة]';
    var yrs = facts.yearsExp;
    var arrMatch = (diagnosis.cvText || '').match(/(\d{1,3})\s*(?:m|mm)\s*(?:sar|usd|aed|arr)/i);
    var titleEn = _v2IsEnglishTitle(job.title || '');
    if (titleEn) {
      var nameEn = '[Your Name]';
      var lines;
      if (band === 'senior') {
        lines = [
          'Dear Hiring Team,',
          'I am applying for the ' + (job.title || '[role]') + ' position at ' + company + '.',
          (yrs ? 'With ' + yrs + ' years of senior experience in ' + (DREAM_ROLE_LIBRARY[diagnosis.family]||{}).familyAr || (diagnosis.family||'the field')
                : 'With significant senior experience in the field')
            + (arrMatch ? ' and direct ownership of ' + arrMatch[0] : '')
            + ', I bring directly relevant leadership experience.',
          'I would welcome the chance to discuss how my background aligns with your roadmap.',
          'Best regards,', nameEn,
        ];
      } else {
        lines = [
          'Dear Hiring Team,',
          'I am applying for the ' + (job.title || '[role]') + ' position at ' + company + '.',
          (yrs && yrs >= 1
            ? 'With ' + yrs + ' years of hands-on experience'
            : 'As an early-career candidate with strong foundations, project experience, and a willingness to learn quickly')
            + ', I am positioned to contribute on day one.',
          'I would be happy to discuss how my background maps to your needs.',
          'Best regards,', nameEn,
        ];
      }
      return lines.join('\n');
    }
    // Arabic
    var nameAr = '[الاسم الكامل]';
    if (band === 'senior') {
      return [
        'تحية طيبة،',
        'أتقدم لشغل وظيفة ' + (job.title || '[المسمى]') + ' في ' + company + '.',
        (yrs ? 'لديّ ' + yrs + ' سنوات' : 'لديّ خبرة قيادية معتبرة') + ' في القيادة' +
          (arrMatch ? ' وملكية مباشرة لـ ' + arrMatch[0] : '') +
          '، مع مسؤولية مباشرة عن مؤشرات النمو والاحتفاظ والتوسع.',
        'يسعدني مناقشة كيف يمكنني المساهمة في خطة الفريق وتعزيز النتائج التنفيذية.',
        'مع خالص التقدير،', nameAr,
      ].join('\n');
    }
    return [
      'تحية طيبة،',
      'أتقدم لشغل وظيفة ' + (job.title || '[المسمى]') + ' في ' + company + '.',
      (yrs && yrs >= 1
        ? 'لديّ ' + yrs + ' سنوات خبرة عملية في المجال مع نتائج قابلة للقياس.'
        : 'أنا في بداية مساري المهني، مع أساس أكاديمي ومشاريع/تدريب مرتبط بالدور، واستعداد للتعلم السريع.'),
      'يسعدني الاجتماع لشرح كيف يمكنني المساهمة في فريقكم.',
      'مع خالص التقدير،', nameAr,
    ].join('\n');
  }

  // ── Checklist + expected questions ────────────────────────────────────
  function _v2APBuildChecklist(job, diagnosis, band){
    var checklist = [
      'حدّثت ملخص السيرة بحيث يطابق عنوان الوظيفة',
      'تضمين كلمات مفتاحية من الوصف الوظيفي',
      'تقديم الأرقام والإنجازات الحقيقية أولاً',
      'مراجعة الإملاء والقواعد بعناية',
      'نسخ Cover Letter وإرفاقه',
    ];
    var questions = [];
    if (band === 'senior') {
      questions.push({ q: 'لماذا هذا الدور تحديداً الآن؟',
        a: 'اذكر دافع قيادي محدد: مرحلة جديدة من النمو / تحدّي مختلف / فرصة لتوسيع الأثر.' });
      questions.push({ q: 'ما أكبر نتيجة تنفيذية حققتها؟',
        a: 'حدّث رقم واحد قابل للقياس + السياق + قرار اتخذته. لا تخترع أرقام.' });
    } else {
      questions.push({ q: 'لماذا اخترت هذا المجال؟',
        a: 'دافع شخصي + مشروع/تجربة دفعتك لاختياره.' });
      questions.push({ q: 'كيف تتعلم تقنية/مهارة جديدة؟',
        a: 'مثال محدد لمهارة تعلّمتها مؤخراً + كيف تعلّمتها.' });
    }
    questions.push({ q: 'فترة الإشعار + الراتب المتوقع؟',
      a: 'فترة الإشعار: [أدخل المدة]. الراتب: [راجع متوسط السوق ثم أجب بنطاق مرن].' });
    return { checklist: checklist, questions: questions };
  }

  // ── Build the full package ────────────────────────────────────────────
  function v2BuildApplyPackage(job, diagnosis){
    if (!job || !diagnosis) return null;
    var facts = diagnosis.cvFacts || extractCvFacts(diagnosis.cvText || '');
    var band = (diagnosis.isSeniorOverride || (facts.yearsExp && facts.yearsExp >= 8) || (diagnosis.intent && diagnosis.intent.inferredSeniority === 'senior_leadership')) ? 'senior'
             : (facts.yearsExp && facts.yearsExp >= 5) ? 'senior'
             : 'junior';
    return {
      job: job,
      band: band,
      family: diagnosis.family || 'unknown',
      match:     _v2APBuildMatchSummary(job, diagnosis, facts, band),
      cvAdjust:  _v2APBuildCvAdjustments(job, diagnosis, facts, band),
      cover:     _v2APBuildCoverLetter(job, diagnosis, facts, band),
      checklist: _v2APBuildChecklist(job, diagnosis, band),
    };
  }

  // ── Apply screen renderer ─────────────────────────────────────────────
  function renderApply(app, route){
    var d = Diagnosis.get();
    if (!d) {
      app.innerHTML = '<div class="v2-empty-state"><div class="v2-empty-emoji">📝</div><h3>اكمل التشخيص أولاً</h3>'
        + '<p>نحتاج تشخيصك عشان نجهز تقديمك.</p>'
        + '<button class="v2-btn v2-btn-primary" onclick="v2Go(\'#/track\')">ابدأ التشخيص ←</button></div>';
      return;
    }
    var job = v2GetSelectedJob();
    if (!job) {
      app.innerHTML = ''
        + '<div class="v2-empty-state">'
        +   '<div class="v2-empty-emoji">🔍</div>'
        +   '<h3>ما لقينا الوظيفة المختارة</h3>'
        +   '<p>الجلسة انتهت أو الوظيفة غير متوفرة. ارجع للوظائف واختر وظيفة من الجديد.</p>'
        +   '<button class="v2-btn v2-btn-primary" onclick="v2Go(\'#/jobs\')">رجوع للوظائف ←</button>'
        + '</div>';
      return;
    }
    var pkg = v2BuildApplyPackage(job, d);
    if (!pkg) {
      app.innerHTML = '<div class="v2-jobs-error"><span>⚠</span><div>ما قدرنا نجهز الباكدج. حاول مرة أخرى.</div></div>';
      return;
    }
    _v2RenderApplyPackage(app, pkg);
  }

  function _v2RenderApplyPackage(app, pkg){
    var job = pkg.job;
    var openHref = job.applyUrl || job.url || '#';
    var safePayload = encodeURIComponent(JSON.stringify({
      id: job.id, title: job.title, company: job.company, url: openHref, source: job.source,
    }));
    // Step 1: Match summary
    var risksHtml = (pkg.match.risks && pkg.match.risks.length)
      ? '<div class="v2-ap-pillrow">' + pkg.match.risks.map(function(r){
          return '<span class="v2-ap-pill is-missing">⚠ ' + escapeHtml(r) + '</span>';
        }).join('') + '</div>'
      : '';
    var step1Body = ''
      + '<ul>' + pkg.match.bullets.map(function(b){ return '<li>' + escapeHtml(b) + '</li>'; }).join('') + '</ul>'
      + risksHtml;

    // Step 2: CV adjustments
    var presentHtml = pkg.cvAdjust.present.length
      ? '<div style="font-size:12px;color:#0a0a0a;font-weight:700;margin-top:9px">كلمات موجودة في سيرتك:</div>' +
        '<div class="v2-ap-pillrow">' + pkg.cvAdjust.present.map(function(s){ return '<span class="v2-ap-pill">' + escapeHtml(s) + '</span>'; }).join('') + '</div>'
      : '';
    var missingHtml = pkg.cvAdjust.missing.length
      ? '<div style="font-size:12px;color:#0a0a0a;font-weight:700;margin-top:9px">كلمات ينقص ذكرها — أضفها إن كانت لديك فعلاً:</div>' +
        '<div class="v2-ap-pillrow">' + pkg.cvAdjust.missing.map(function(s){ return '<span class="v2-ap-pill is-missing">+ ' + escapeHtml(s) + '</span>'; }).join('') + '</div>'
      : '';
    var seniorLine = pkg.cvAdjust.seniorMetricLine
      ? '<div style="font-size:13px;color:#78350f;background:#fef3c7;border:1px solid #fcd34d;border-radius:9px;padding:9px 12px;margin-top:9px;font-weight:700">💡 ' + escapeHtml(pkg.cvAdjust.seniorMetricLine) + '</div>'
      : '';
    var step2Body = ''
      + '<ul>' + pkg.cvAdjust.picks.map(function(b){ return '<li>' + escapeHtml(b) + '</li>'; }).join('') + '</ul>'
      + presentHtml + missingHtml + seniorLine;

    // Step 3: Cover letter
    var step3Body = '<div style="white-space:pre-line;font-size:13.5px;color:#0a0a0a;line-height:1.85">' + escapeHtml(pkg.cover) + '</div>';

    // Step 4: Checklist + expected questions
    var checkHtml = pkg.checklist.checklist.map(function(c, i){
      return '<label class="v2-ap-check"><input type="checkbox"><span>' + escapeHtml(c) + '</span></label>';
    }).join('');
    var qaHtml = pkg.checklist.questions.map(function(qa){
      return '<div class="v2-ap-qa"><div class="v2-ap-q">' + escapeHtml(qa.q) + '</div><div class="v2-ap-a">' + escapeHtml(qa.a) + '</div></div>';
    }).join('');
    var step4Body = checkHtml + '<div style="margin-top:11px;font-size:12px;color:#0a0a0a;font-weight:800">أسئلة متوقعة في المقابلة:</div>' + qaHtml;

    app.innerHTML = ''
      // Job header
      + '<div class="v2-ap-job">'
      +   '<div class="v2-ap-job-title">' + escapeHtml(job.title || '—') + '</div>'
      +   '<div class="v2-ap-job-meta">'
      +     '🏢 <b>' + escapeHtml(job.company || '—') + '</b>'
      +     (job.location ? ' · 📍 ' + escapeHtml(job.location) : '')
      +     (job.match && job.match.score ? ' · ' + Math.round(job.match.score) + '٪ تطابق' : '')
      +   '</div>'
      + '</div>'
      // Honest banner
      + '<div class="v2-ap-honest">هذي صياغة مقترحة بناءً على تشخيصك والوظيفة. <strong>راجعها قبل الإرسال.</strong> لا تضف أرقام أو شركات أو شهادات غير حقيقية.</div>'
      // Step 1
      + '<div class="v2-ap-step">'
      +   '<div class="v2-ap-step-h"><div class="v2-ap-step-h-l">'
      +     '<div class="v2-ap-step-num">1</div>'
      +     '<div class="v2-ap-step-title">لماذا هذه الوظيفة مناسبة لك؟</div>'
      +   '</div><button class="v2-ap-step-copy" onclick="v2ApplyCopy(\'summary\')">📋 نسخ</button></div>'
      +   '<div class="v2-ap-step-body" id="v2ApStep1">' + step1Body + '</div>'
      + '</div>'
      // Step 2
      + '<div class="v2-ap-step">'
      +   '<div class="v2-ap-step-h"><div class="v2-ap-step-h-l">'
      +     '<div class="v2-ap-step-num">2</div>'
      +     '<div class="v2-ap-step-title">تعديلات السيرة لهذه الوظيفة</div>'
      +   '</div><button class="v2-ap-step-copy" onclick="v2ApplyCopy(\'cv\')">📋 نسخ</button></div>'
      +   '<div class="v2-ap-step-body" id="v2ApStep2">' + step2Body + '</div>'
      + '</div>'
      // Step 3
      + '<div class="v2-ap-step">'
      +   '<div class="v2-ap-step-h"><div class="v2-ap-step-h-l">'
      +     '<div class="v2-ap-step-num">3</div>'
      +     '<div class="v2-ap-step-title">رسالة التقديم / Cover Letter</div>'
      +   '</div><button class="v2-ap-step-copy" onclick="v2ApplyCopy(\'cover\')">📋 نسخ الرسالة</button></div>'
      +   '<div class="v2-ap-step-body" id="v2ApStep3">' + step3Body + '</div>'
      + '</div>'
      // Step 4
      + '<div class="v2-ap-step">'
      +   '<div class="v2-ap-step-h"><div class="v2-ap-step-h-l">'
      +     '<div class="v2-ap-step-num">4</div>'
      +     '<div class="v2-ap-step-title">Checklist + أسئلة متوقعة</div>'
      +   '</div></div>'
      +   '<div class="v2-ap-step-body" id="v2ApStep4">' + step4Body + '</div>'
      + '</div>'
      // Actions (sticky)
      + '<div class="v2-ap-actions">'
      +   '<a class="v2-btn v2-btn-primary" target="_blank" rel="noopener" href="' + escapeHtml(openHref) + '" onclick="v2ApplyOpenJob(\'' + safePayload + '\')">افتح الوظيفة وقدّم ←</a>'
      +   '<div class="v2-ap-actions-row">'
      +     '<button class="v2-btn v2-btn-secondary" onclick="v2ApplyMarkApplied(\'' + safePayload + '\')">سجلت تقديم</button>'
      +     '<button class="v2-btn v2-btn-secondary" onclick="v2Go(\'#/jobs\')">رجوع للوظائف</button>'
      +   '</div>'
      + '</div>';
    // Stash pkg + payload for action handlers.
    window.__v2Ap = { pkg: pkg, payload: safePayload };
  }

  // ── Apply actions ─────────────────────────────────────────────────────
  function v2ApplyCopy(type){
    var s = window.__v2Ap;
    if (!s || !s.pkg) return;
    var text = '';
    if (type === 'summary') {
      text = (s.pkg.match.bullets || []).map(function(b){ return '• ' + b; }).join('\n');
      if (s.pkg.match.risks && s.pkg.match.risks.length) {
        text += '\n\nمخاطر:\n' + s.pkg.match.risks.map(function(r){ return '⚠ ' + r; }).join('\n');
      }
    } else if (type === 'cv') {
      text = 'تعديلات السيرة:\n' + (s.pkg.cvAdjust.picks || []).map(function(b){ return '• ' + b; }).join('\n');
      if (s.pkg.cvAdjust.missing && s.pkg.cvAdjust.missing.length) {
        text += '\n\nكلمات ينقص ذكرها:\n' + s.pkg.cvAdjust.missing.join(' · ');
      }
      if (s.pkg.cvAdjust.seniorMetricLine) {
        text += '\n\n' + s.pkg.cvAdjust.seniorMetricLine;
      }
    } else if (type === 'cover') {
      text = s.pkg.cover || '';
    }
    var done = function(){
      // Successful copy of any section marks "apply_started" in the journey.
      if (typeof DarbiBrain !== 'undefined') DarbiBrain.learn({ type: 'apply_copy', section: type });
      alert('✓ تم النسخ.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(done);
    } else { done(); }
  }

  function v2ApplyOpenJob(payloadEnc){
    try {
      var p = JSON.parse(decodeURIComponent(payloadEnc));
      if (typeof DarbiBrain !== 'undefined') DarbiBrain.learn({ type: 'apply_job_opened', job: p });
    } catch(e){}
  }

  function v2ApplyMarkApplied(payloadEnc){
    var p;
    try { p = JSON.parse(decodeURIComponent(payloadEnc)); } catch(e){ return; }
    if (!p) return;
    // De-dupe by company+role; if already applied, just advance UI.
    var existing = false;
    if (typeof Applications !== 'undefined' && Applications.list) {
      var apps = Applications.list();
      for (var i = 0; i < apps.length; i++) {
        if (apps[i].company === (p.company || '') && apps[i].role === (p.title || '')) { existing = true; break; }
      }
    }
    if (!existing && typeof Applications !== 'undefined' && Applications.add) {
      Applications.add({
        company: p.company || '',
        role:    p.title   || '',
        url:     p.url     || '',
        status:  'applied',
      });
    }
    if (typeof DarbiJourney !== 'undefined' && DarbiJourney.markApplicationLogged) DarbiJourney.markApplicationLogged();
    // Clear the selected-job stash so a fresh apply session starts from jobs.
    try { localStorage.removeItem('darbi_v2_selected_job'); } catch(e){}
    var app = document.getElementById('v2-app');
    if (app) {
      app.innerHTML = ''
        + '<div class="v2-ap-success">'
        +   '<div class="v2-ap-success-emoji">✅</div>'
        +   '<div class="v2-ap-success-h">تم تسجيل تقديمك</div>'
        +   '<div class="v2-ap-success-sub">' + escapeHtml(p.title || 'الوظيفة') + ' في <strong>' + escapeHtml(p.company || 'الشركة') + '</strong></div>'
        + '</div>'
        + '<div class="v2-card" style="text-align:center">'
        +   '<p style="font-size:14px;color:#0a0a0a;line-height:1.7;margin-bottom:12px"><strong>الخطوة التالية:</strong> تابع النتيجة. لما يجيك رد أو مقابلة، حدّث الحالة في تتبع التقديمات وراح نجهّز لك جلسة تدريب.</p>'
        +   '<button class="v2-btn v2-btn-primary" onclick="v2Go(\'#/jobs\')">جهّز تقديم آخر ←</button>'
        + '</div>';
    }
  }

  // ════════════════════════════════════════════════════════════════════════
  // PHASE 1 TASK 7 — Application Tracker (#/tracker)
  // The loop engine: list applied jobs, update outcomes, drive next action.
  // Reads from Applications namespace (same shape V1 uses). Status updates
  // auto-log to DarbiBrain (via Applications.update). markInterviewLogged
  // fires only when user explicitly clicks "جهّز للمقابلة" — separates
  // "got an interview" from "started preparing".
  // ════════════════════════════════════════════════════════════════════════

  // ── Weekly stats: count apps where appliedAt is within last 7 days ────
  function _v2TrackerWeeklyStats(){
    if (typeof Applications === 'undefined' || !Applications.raw) return { thisWeek: 0, target: 10, total: 0 };
    var apps = Applications.raw();
    var weekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
    var thisWeek = 0;
    apps.forEach(function(a){
      var t = Date.parse(a.appliedAt || a.createdAt || 0);
      if (isFinite(t) && t >= weekAgo) thisWeek++;
    });
    return { thisWeek: thisWeek, target: 10, total: apps.length };
  }

  // ── Pick the journey-aware "next action" card content ────────────────
  function _v2TrackerNextActionCard(stats){
    // Highest-priority status first: accepted > interview > reply > rejected > applied > empty
    if (stats.accepted > 0) {
      return {
        cls: 'is-accepted',
        h: '🎉 مبروك! وصلت',
        body: 'تم قبولك في وظيفة. خذ وقتك للاحتفال + ابدأ التحضير لأول يوم. لو تبي تستمر في البحث عن خيارات أخرى، تقدر.',
        cta: null, ctaRoute: null,
      };
    }
    if (stats.interview > 0) {
      return {
        cls: 'is-interview',
        h: '🎯 عندك مقابلة! جهّز نفسك',
        body: 'نوصيك تجلس مع دربي في جلسة تدريب ٥ أسئلة قبل المقابلة. نغطي السؤال الأهم في دورك.',
        cta: 'جهّز للمقابلة ←', ctaRoute: '#/interview',
      };
    }
    if (stats.reply > 0) {
      return {
        cls: '',
        h: '📬 وصلك رد',
        body: 'راجع الرد بعناية. لو طلبوا مقابلة، حدّث الحالة هنا. لو رفض غير مباشر، نشوف الخيارات الأخرى.',
        cta: 'عرض الوظائف', ctaRoute: '#/jobs',
      };
    }
    if (stats.rejected > 0 && stats.applied === 0 && stats.reply === 0 && stats.interview === 0) {
      return {
        cls: 'is-rejected',
        h: 'لا تحبط — نراجع الاستهداف',
        body: 'الرفض جزء من العملية. نراجع نوع الوظائف اللي تستهدفها ونجهز تقديم أفضل. عادة المشكلة في المطابقة، مو فيك.',
        cta: 'عرض الوظائف من جديد ←', ctaRoute: '#/jobs',
      };
    }
    if (stats.applied > 0) {
      // Use insight() if available — based on V1 Applications.insight() logic.
      var insight = (Applications.insight && Applications.insight()) || null;
      var body = insight || ('عندك ' + stats.applied + ' تقديم تنتظر الرد. حدّث الحالة هنا لما يجيك أي رد، وراح نتابع معك.');
      return {
        cls: '',
        h: 'استمر في التقديم',
        body: body,
        cta: 'جهّز تقديم آخر', ctaRoute: '#/jobs',
      };
    }
    return null; // empty state handled separately
  }

  // ── Single application row ────────────────────────────────────────────
  function _v2TrackerRow(app){
    var status = app.status || 'applied';
    var statusLabels = {
      applied: 'في الانتظار',
      reply: 'وصل رد',
      interview: 'مقابلة',
      rejected: 'رفض',
      accepted: 'قبول',
    };
    var openLink = app.url
      ? '<a class="v2-tk-row-action" target="_blank" rel="noopener" href="' + escapeHtml(app.url) + '" onclick="v2TrackerOpenJob(\'' + escapeHtml(app.id) + '\')">↗ افتح الوظيفة</a>'
      : '';
    var prepBtn = (status === 'reply' || status === 'interview')
      ? '<button class="v2-tk-row-action is-primary" onclick="v2TrackerPrepInterview(\'' + escapeHtml(app.id) + '\')">جهّز للمقابلة</button>'
      : '';
    var appliedDate = '';
    if (app.appliedAt) {
      try {
        appliedDate = '<span>📅 <b>قُدّم:</b> ' + escapeHtml(app.appliedAt) + '</span>';
      } catch(e){}
    }
    return ''
      + '<div class="v2-tk-row" data-app-id="' + escapeHtml(app.id) + '">'
      +   '<div class="v2-tk-row-1">'
      +     '<div>'
      +       '<div class="v2-tk-role">' + escapeHtml(app.role || '—') + '</div>'
      +       '<div class="v2-tk-company">' + escapeHtml(app.company || '—') + '</div>'
      +     '</div>'
      +     '<span class="v2-tk-status-pill is-' + status + '">' + escapeHtml(statusLabels[status] || status) + '</span>'
      +   '</div>'
      +   '<div class="v2-tk-meta">' + appliedDate + '</div>'
      +   '<div class="v2-tk-status-row">'
      +     '<span class="v2-tk-status-label">عدّل الحالة:</span>'
      +     '<select class="v2-tk-status-sel" onchange="v2TrackerStatusUpdate(\'' + escapeHtml(app.id) + '\', this.value)">'
      +       '<option value="applied"' + (status === 'applied' ? ' selected' : '') + '>في الانتظار</option>'
      +       '<option value="reply"' + (status === 'reply' ? ' selected' : '') + '>وصل رد</option>'
      +       '<option value="interview"' + (status === 'interview' ? ' selected' : '') + '>مقابلة</option>'
      +       '<option value="rejected"' + (status === 'rejected' ? ' selected' : '') + '>رفض</option>'
      +       '<option value="accepted"' + (status === 'accepted' ? ' selected' : '') + '>قبول</option>'
      +     '</select>'
      +   '</div>'
      +   '<div class="v2-tk-row-actions">'
      +     openLink
      +     prepBtn
      +     '<button class="v2-tk-row-action is-danger" onclick="v2TrackerRemove(\'' + escapeHtml(app.id) + '\')">🗑 حذف</button>'
      +   '</div>'
      + '</div>';
  }

  // ── #/tracker main renderer ───────────────────────────────────────────
  function renderTracker(app, route){
    if (typeof Applications === 'undefined' || !Applications.list) {
      app.innerHTML = '<div class="v2-jobs-error"><span>⚠</span><div>تتبع التقديمات غير متوفر.</div></div>';
      return;
    }
    var apps = Applications.list();
    var stats = Applications.stats();
    var weekly = _v2TrackerWeeklyStats();

    // Empty state
    if (!apps.length) {
      app.innerHTML = ''
        + '<div class="v2-tk-empty">'
        +   '<div class="v2-tk-empty-emoji">📋</div>'
        +   '<div class="v2-tk-empty-h">ما عندك تقديمات بعد</div>'
        +   '<div class="v2-tk-empty-sub">لما تجهّز تقديم لأي وظيفة وتسجّله، يبان هنا.<br>دربي يقرأ النمط من ردودك ويعدّل خطتك بناءً عليه.</div>'
        +   '<button class="v2-btn v2-btn-primary" onclick="v2Go(\'#/jobs\')">اعرض الوظائف ←</button>'
        + '</div>';
      return;
    }

    // Weekly progress
    var pct = Math.min(100, Math.round((weekly.thisWeek / weekly.target) * 100));
    var metCls = weekly.thisWeek >= weekly.target ? ' is-met' : '';
    var weeklyHtml = ''
      + '<div class="v2-tk-weekly">'
      +   '<div class="v2-tk-weekly-h"><span>📊 تقدمك هذا الأسبوع</span><span style="font-size:11.5px;color:#64748b">إجمالي: ' + weekly.total + '</span></div>'
      +   '<div class="v2-tk-weekly-meta">قدمت على <b>' + weekly.thisWeek + '</b> من هدف <b>' + weekly.target + '</b> تقديم</div>'
      +   '<div class="v2-tk-weekly-bar"><div class="v2-tk-weekly-bar-fill' + metCls + '" style="width:' + pct + '%"></div></div>'
      + '</div>';

    // Journey-aware next action card
    var nextCard = _v2TrackerNextActionCard(stats);
    var nextHtml = nextCard
      ? '<div class="v2-tk-next ' + nextCard.cls + '">'
        +   '<div class="v2-tk-next-h">' + escapeHtml(nextCard.h) + '</div>'
        +   '<div class="v2-tk-next-body">' + escapeHtml(nextCard.body) + '</div>'
        +   (nextCard.cta && nextCard.ctaRoute ? '<button class="v2-tk-next-cta" onclick="v2Go(\'' + escapeHtml(nextCard.ctaRoute) + '\')">' + escapeHtml(nextCard.cta) + '</button>' : '')
        + '</div>'
      : '';

    // Applications list
    var listHtml = '<div class="v2-tk-list-h">تقديماتك (' + apps.length + ')</div>'
      + apps.map(_v2TrackerRow).join('');

    app.innerHTML = weeklyHtml + nextHtml + listHtml
      + '<div style="margin-top:13px;text-align:center"><button class="v2-btn v2-btn-secondary" onclick="v2Go(\'#/jobs\')">+ جهّز تقديم جديد</button></div>';
  }

  // ── Tracker actions ───────────────────────────────────────────────────
  function v2TrackerStatusUpdate(appId, newStatus){
    if (typeof Applications === 'undefined' || !Applications.update) return;
    // Applications.update auto-logs DarbiBrain event for the status transition.
    Applications.update(appId, { status: newStatus });
    // Journey-state side effects: NONE here. Interview prep is started by
    // the explicit "جهّز للمقابلة" click below, not by the status change
    // itself — separates "got an interview" from "started preparing".
    var appEl = document.getElementById('v2-app');
    if (appEl) renderTracker(appEl, V2_ROUTES['#/tracker']);
  }

  function v2TrackerOpenJob(appId){
    // Anchor opens externally. Just log.
    if (typeof DarbiBrain !== 'undefined') DarbiBrain.learn({ type: 'tracker_job_opened', payload: { id: appId } });
  }

  function v2TrackerPrepInterview(appId){
    // Mark journey milestone + route to interview screen (still placeholder
    // until Task 8). The journey state machine will then surface "follow_up"
    // as the next action after interview is logged.
    if (typeof DarbiJourney !== 'undefined' && DarbiJourney.markInterviewLogged) DarbiJourney.markInterviewLogged();
    if (typeof DarbiBrain !== 'undefined') DarbiBrain.learn({ type: 'interview_prep_started', payload: { id: appId } });
    v2Go('#/interview?j=' + encodeURIComponent(appId));
  }

  function v2TrackerRemove(appId){
    if (typeof Applications === 'undefined' || !Applications.remove) return;
    if (!confirm('احذف هذا التقديم من قائمتك؟')) return;
    Applications.remove(appId);
    var appEl = document.getElementById('v2-app');
    if (appEl) renderTracker(appEl, V2_ROUTES['#/tracker']);
  }

  // Direction-pick rebuild (low confidence path): user clicks a family chip.
  async function v2RebuildWithFamily(family){
    var draft = V2Draft.get();
    var dreamRole = (draft.dreamRole || '').trim();
    var cvText    = (draft.cvText    || '').trim();
    var answers   = draft.quizAnswers || {};
    answers.dreamRole = dreamRole;
    var app = document.getElementById('v2-app');
    if (app) app.innerHTML = '<div class="v2-dx-loading"><div class="v2-dx-loading-spin"></div><div class="v2-dx-loading-text">نعيد بناء التشخيص...</div></div>';
    try {
      var intentOverride = { family: family, confidence: 90, source: 'user_pick', isSimpleJob: family === 'simple_job', inferredSeniority: inferStatusFromCV(cvText) };
      var diag = await buildDiagnosis(dreamRole, cvText, answers, intentOverride);
      Diagnosis.set(diag);
      _v2PaintDiagnosis(app, diag);
    } catch(e){
      if (app) app.innerHTML = '<div class="v2-dx-error"><span>⚠</span><div>ما قدرنا نعيد البناء — حاول مرة أخرى.</div></div>';
    }
  }
  </script>
