  // Build the per-application question list. 4 universal + 1 family + 1
  // closing question = 6 total. Order matters (mirrors typical interview
  // flow: opener → motivation → behavioral → self-awareness → family →
  // candidate-asks).
  function _v2InterviewQuestions(diagnosis, application){
    var fam = (diagnosis && diagnosis.family) || 'general_entry';
    if (!V2_INTERVIEW_FAMILY_Q[fam]) fam = 'general_entry';
    var famQ = V2_INTERVIEW_FAMILY_Q[fam];
    var role = (application && application.role)    || (diagnosis && diagnosis.dreamRole) || 'الدور';
    var company = (application && application.company) || '';

    return [
      {
        id: 'intro',
        tag: 'افتتاحية',
        q: 'حدثني عن نفسك',
        why: 'أكثر سؤال متوقع وأقل سؤال يجاوب عليه الناس بطريقة جيدة. <b>القاعدة:</b> ٩٠ ثانية، ليس سيرة حياة.',
        focus: [
          'جملتان عن دورك الحالي / آخر دور (مو من المدرسة)',
          'إنجاز واحد تفتخر فيه — رقم أو نتيجة قابلة للقياس',
          'مهارة محورية تربطها بالدور المتقدّم له',
          'سبب اهتمامك بهذا الدور تحديداً — لازم يكون له علاقة بـ ' + (company || role),
        ],
      },
      {
        id: 'motivation',
        tag: 'الدافع',
        q: company ? 'ليش تبي تشتغل في ' + company + ' بالذات؟' : 'ليش تبي تشتغل معنا؟',
        why: 'يكشف لو سويت بحث جدّي عن الشركة، أو جاي تقدم على أي مكان. <b>القاعدة:</b> اذكر شي محدد، ليس عام.',
        focus: [
          'شي محدد عن منتج/سوق/قيم الشركة قرأته أو جربته',
          'كيف يربط هذا بمسار مسيرتك (مو فقط "أحب التطور")',
          'وش تعرضه أنت للشركة (مهارة / خبرة / منظور)',
          'تجنّب: الرواتب، المنافع، أو "اسم الشركة قوي"',
        ],
      },
      {
        id: 'star',
        tag: 'سلوكي عام',
        q: 'احكِ لي عن مشروع/موقف صعب — وكيف تعاملت معه؟',
        why: 'الجواب الجيد دائماً يستخدم STAR. <b>S</b>ituation, <b>T</b>ask, <b>A</b>ction, <b>R</b>esult — لا تخلط بينها.',
        focus: [
          'S — الوضع باختصار (٢٠ ثانية): المكان والوقت والتعقيد',
          'T — مهمتك أنت تحديداً (مو الفريق)',
          'A — ٢-٣ خطوات اتخذتها أنت + سبب كل خطوة',
          'R — النتيجة بأرقام إن أمكن، ودرس تعلمته',
        ],
      },
      {
        id: 'weakness',
        tag: 'وعي ذاتي',
        q: 'ما هي نقطة ضعفك؟',
        why: 'فخ شائع: "أنا perfectionist" — هذا جواب مكسور. <b>القاعدة:</b> ضعف حقيقي + كيف تشتغل عليه.',
        focus: [
          'ضعف فعلي مرتبط بالعمل (ليس شيء قاتل للدور)',
          'موقف ملموس صار فيك بسبب هذا الضعف',
          'الخطوات اللي اتخذتها لتحسينه (تدريب، أدوات، تفويض)',
          'كيف تقيس التحسن — مو فقط "صرت أفضل"',
        ],
      },
      {
        id: 'family_behavioral',
        tag: 'سلوكي خاص بدورك',
        family: true,
        q: famQ.q,
        why: 'سؤال شائع في مقابلات هذا التخصص. الإجابة هنا تظهر فهمك العملي للدور، مو فقط النظري.',
        focus: famQ.focus,
      },
      {
        id: 'candidate_asks',
        tag: 'أسئلتك أنت',
        q: 'في النهاية: عندك أسئلة لي؟',
        why: '"لا، شكراً" = جواب خاسر. أفضل المرشحين عندهم ٣ أسئلة جاهزة. <b>القاعدة:</b> أسئلة عميقة، ليس "متى أبدأ؟".',
        focus: [
          'سؤال عن الفريق: "وش تركيبة الفريق وكيف يقاس النجاح في أول ٩٠ يوم؟"',
          'سؤال عن التحدي: "ما أكبر تحدٍّ يواجه هذا الدور حالياً؟"',
          'سؤال عن الثقافة: "كيف يتم اتخاذ القرارات الكبيرة هنا؟"',
          'احفظها مكتوبة معك — الذاكرة تخون وقت الضغط',
        ],
      },
    ];
  }

  // Returns the application object for ?j=<id>, or null.
  function _v2InterviewLookupApp(appId){
    if (!appId) return null;
    if (typeof Applications === 'undefined' || !Applications.list) return null;
    var apps = Applications.list();
    for (var i = 0; i < apps.length; i++) {
      if (apps[i].id === appId) return apps[i];
    }
    return null;
  }

  // ── #/interview main renderer ─────────────────────────────────────────
  function renderInterview(el, route){
    if (typeof Applications === 'undefined' || !Applications.list) {
      el.innerHTML = '<div class="v2-jobs-error"><span>⚠</span><div>تدريب المقابلة غير متوفر.</div></div>';
      return;
    }
    var jParam = v2HashParam('j');
    var diagnosis = (typeof Diagnosis !== 'undefined' && Diagnosis.get) ? Diagnosis.get() : {};

    // ── Path 1: specific application by ?j= ──
    if (jParam) {
      var application = _v2InterviewLookupApp(jParam);
      if (!application) {
        el.innerHTML = ''
          + '<div class="v2-tk-empty">'
          +   '<div class="v2-tk-empty-emoji">🔎</div>'
          +   '<div class="v2-tk-empty-h">ما لقينا التقديم المختار</div>'
          +   '<div class="v2-tk-empty-sub">يمكن انحذف من تقديماتك. ارجع للقائمة واختر تقديم في حالة <b>مقابلة</b>.</div>'
          +   '<button class="v2-btn v2-btn-secondary" onclick="v2Go(\'#/tracker\')">رجوع لتقديماتك</button>'
          + '</div>';
        return;
      }
      _v2InterviewRenderSession(el, application, diagnosis);
      return;
    }

    // ── Path 2: pick from interview-status apps ──
    var allApps = Applications.list();
    var interviewApps = allApps.filter(function(a){ return a.status === 'interview' || a.status === 'reply'; });

    if (!interviewApps.length) {
      el.innerHTML = ''
        + '<div class="v2-tk-empty">'
        +   '<div class="v2-tk-empty-emoji">🎤</div>'
        +   '<div class="v2-tk-empty-h">ما عندك مقابلات حالياً</div>'
        +   '<div class="v2-tk-empty-sub">لما تحدّث حالة أي تقديم إلى <b>"وصل رد"</b> أو <b>"مقابلة"</b>، يبدأ التدريب الموجّه هنا.<br>لا تقدّم بدون تدريب — كل دقيقة هنا تساوي ٢٠ دقيقة وقت المقابلة.</div>'
        +   '<button class="v2-btn v2-btn-primary" onclick="v2Go(\'#/tracker\')">افتح تقديماتك ←</button>'
        + '</div>';
      return;
    }

    // List picker
    var rowsHtml = interviewApps.map(function(a){
      var done = _v2IvIsCompleted(a.id);
      var pillCls = done ? ' is-done' : '';
      var pillTxt = done ? '✓ تم التدريب' : 'ابدأ التدريب';
      return ''
        + '<div class="v2-tk-row">'
        +   '<div class="v2-tk-row-1">'
        +     '<div>'
        +       '<div class="v2-tk-role">' + escapeHtml(a.role || '—') + '</div>'
        +       '<div class="v2-tk-company">' + escapeHtml(a.company || '—') + '</div>'
        +     '</div>'
        +     '<span class="v2-iv-q-tag' + pillCls + '">' + escapeHtml(pillTxt) + '</span>'
        +   '</div>'
        +   '<div class="v2-tk-row-actions">'
        +     '<button class="v2-tk-row-action is-primary" onclick="v2Go(\'#/interview?j=' + escapeHtml(encodeURIComponent(a.id)) + '\')">' + (done ? 'راجع التدريب' : 'ابدأ التدريب') + ' ←</button>'
        +   '</div>'
        + '</div>';
    }).join('');

    el.innerHTML = ''
      + '<div class="v2-iv-context">'
      +   '<div class="v2-iv-context-eyebrow">🎤 تدريب المقابلة</div>'
      +   '<div class="v2-iv-context-role">جلسة موجّهة — ٦ أسئلة</div>'
      +   '<div class="v2-iv-context-meta">اختر التقديم اللي بتتدرّب لمقابلته. كل جلسة مفصّلة على عائلة وظيفتك (' + escapeHtml((diagnosis && diagnosis.dreamRole) || 'دورك') + ').</div>'
      + '</div>'
      + '<div class="v2-iv-list-h">تقديمات بحاجة لتدريب (' + interviewApps.length + ')</div>'
      + rowsHtml;
  }

  // Renders the actual guided session for one application.
  function _v2InterviewRenderSession(el, application, diagnosis){
    var questions = _v2InterviewQuestions(diagnosis, application);
    var total = questions.length;
    var idx = _v2IvGetIdx(application.id);
    if (idx < 0) idx = 0;
    if (idx > total) idx = total; // finished state

    var doneCount = Math.min(idx, total);
    var pct = Math.round((doneCount / total) * 100);
    var allDone = doneCount >= total;

    // Context header (company + role + status)
    var statusMap = { applied: 'في الانتظار', reply: 'وصل رد', interview: 'مقابلة', rejected: 'رفض', accepted: 'قبول' };
    var ctxHtml = ''
      + '<div class="v2-iv-context">'
      +   '<div class="v2-iv-context-eyebrow">🎤 تتدرّب لمقابلة</div>'
      +   '<div class="v2-iv-context-role">' + escapeHtml(application.role || '—') + '</div>'
      +   '<div class="v2-iv-context-co">' + escapeHtml(application.company || '—') + '</div>'
      +   '<div class="v2-iv-context-meta">الحالة: <b>' + escapeHtml(statusMap[application.status] || application.status) + '</b> · تخصصك: <b>' + escapeHtml((diagnosis && diagnosis.dreamRole) || '—') + '</b></div>'
      + '</div>';

    var progressHtml = ''
      + '<div class="v2-iv-progress">'
      +   '<div class="v2-iv-progress-row"><span>تقدمك في الجلسة</span><span>' + doneCount + ' / ' + total + '</span></div>'
      +   '<div class="v2-iv-progress-bar"><div class="v2-iv-progress-bar-fill' + (allDone ? ' is-done' : '') + '" style="width:' + pct + '%"></div></div>'
      + '</div>';

    if (allDone) {
      el.innerHTML = ctxHtml + progressHtml
        + '<div class="v2-iv-finish-card">'
        +   '<div class="v2-iv-finish-h">✓ خلصت الجلسة</div>'
        +   '<div class="v2-iv-finish-sub">٦ أسئلة، بنية واضحة لكل واحد. الباقي عليك: كرّر الإجابات بصوت عالٍ ٣ مرات قبل المقابلة.</div>'
        +   '<button class="v2-iv-finish-cta" onclick="v2InterviewFinish(\'' + escapeHtml(application.id) + '\')">رجوع لتقديماتي ←</button>'
        + '</div>'
        + '<div style="text-align:center;margin-top:6px"><button class="v2-iv-btn" onclick="v2InterviewRestart(\'' + escapeHtml(application.id) + '\')">↺ ابدأ الجلسة من جديد</button></div>';
      return;
    }

    var q = questions[idx];
    var focusList = (q.focus || []).map(function(f){ return '<li>' + escapeHtml(f) + '</li>'; }).join('');
    var tagCls = q.family ? ' is-family' : '';

    var prevDisabled = idx === 0 ? ' disabled' : '';
    var isLast = idx === total - 1;

    el.innerHTML = ctxHtml + progressHtml
      + '<div class="v2-iv-q">'
      +   '<div class="v2-iv-q-tag' + tagCls + '">' + escapeHtml(q.tag) + ' · سؤال ' + (idx + 1) + '/' + total + '</div>'
      +   '<div class="v2-iv-q-text">' + escapeHtml(q.q) + '</div>'
      +   '<div class="v2-iv-q-why">' + q.why + '</div>'
      +   '<div class="v2-iv-q-focus-h">ركّز على:</div>'
      +   '<ul class="v2-iv-q-focus">' + focusList + '</ul>'
      +   '<div class="v2-iv-q-actions">'
      +     '<button class="v2-iv-btn" onclick="v2InterviewPrev(\'' + escapeHtml(application.id) + '\')"' + prevDisabled + '>← السابق</button>'
      +     '<button class="v2-iv-btn is-success" onclick="v2InterviewMarkDone(\'' + escapeHtml(application.id) + '\')">' + (isLast ? 'تم — أنهِ الجلسة ✓' : 'تم — التالي ✓') + '</button>'
      +   '</div>'
      + '</div>';
  }

  // Action handlers
  function v2InterviewMarkDone(appId){
    var idx = _v2IvGetIdx(appId);
    var application = _v2InterviewLookupApp(appId);
    var diagnosis = (typeof Diagnosis !== 'undefined' && Diagnosis.get) ? Diagnosis.get() : {};
    var total = application ? _v2InterviewQuestions(diagnosis, application).length : 6;
    var next = idx + 1;
    _v2IvSetIdx(appId, next);
    if (typeof DarbiBrain !== 'undefined') DarbiBrain.learn({ type: 'interview_question_done', payload: { id: appId, qIdx: idx } });
    if (next >= total) {
      _v2IvMarkCompleted(appId);
      // markInterviewLogged is idempotent in DarbiJourney (just sets the bool).
      if (typeof DarbiJourney !== 'undefined' && DarbiJourney.markInterviewLogged) DarbiJourney.markInterviewLogged();
      if (typeof DarbiBrain !== 'undefined') DarbiBrain.learn({ type: 'interview_session_completed', payload: { id: appId } });
    }
    var el = document.getElementById('v2-app');
    if (el) renderInterview(el, V2_ROUTES['#/interview']);
  }

  function v2InterviewPrev(appId){
    var idx = _v2IvGetIdx(appId);
    if (idx > 0) _v2IvSetIdx(appId, idx - 1);
    var el = document.getElementById('v2-app');
    if (el) renderInterview(el, V2_ROUTES['#/interview']);
  }

  function v2InterviewRestart(appId){
    if (!confirm('ابدأ الجلسة من الأول؟')) return;
    var p = _v2IvReadProgress();
    delete p[appId];
    _v2IvWriteProgress(p);
    var el = document.getElementById('v2-app');
    if (el) renderInterview(el, V2_ROUTES['#/interview']);
  }

  function v2InterviewFinish(appId){
    // Finish = navigate back to tracker. Journey + brain already fired at
    // the moment of completing the last question.
    if (typeof DarbiBrain !== 'undefined') DarbiBrain.learn({ type: 'interview_session_closed', payload: { id: appId } });
    v2Go('#/tracker');
  }

  // ════════════════════════════════════════════════════════════════════════
  // PHASE 1 TASK 9 — #/dashboard
  // V2 home for returning users. Single next-action CTA from DarbiJourney,
  // plus weekly progress + diagnosis summary + roadmap + recent activity.
  // Honest empty state for first-time users (no placeholder "—" cells).
  // ════════════════════════════════════════════════════════════════════════

  // Friendly Arabic name + emoji for the family.
  function _v2DbFamilyName(family){
    var L = (typeof DREAM_ROLE_LIBRARY !== 'undefined' && DREAM_ROLE_LIBRARY[family]) || null;
    if (L && L.familyAr) return L.familyAr;
    return family || '—';
  }

  // Brain event types → Arabic display.
  var V2_DB_EVENT_LABELS = {
    diagnosis_done:               { emoji:'🔎', text:'تم بناء تشخيصك' },
    journey_cv_audit_done:        { emoji:'📝', text:'حلّلت سيرتك' },
    journey_jobs_viewed:          { emoji:'💼', text:'استعرضت وظائف' },
    jobs_searched:                { emoji:'💼', text:'بحثت عن وظائف' },
    apply_started:                { emoji:'📨', text:'بدأت تجهيز تقديم' },
    journey_apply_package_created:{ emoji:'📦', text:'جهّزت ملف تقديم' },
    journey_application_logged:   { emoji:'✅', text:'سجّلت تقديم' },
    application_logged:           { emoji:'✅', text:'سجّلت تقديم' },
    reply_received:               { emoji:'📬', text:'وصلك رد' },
    interview_received:           { emoji:'🎤', text:'وصلتك مقابلة' },
    interview_prep_started:       { emoji:'🎯', text:'بدأت تدريب مقابلة' },
    interview_session_completed:  { emoji:'🏁', text:'خلّصت جلسة تدريب مقابلة' },
    accepted:                     { emoji:'🎉', text:'تم قبولك' },
    rejected:                     { emoji:'📕', text:'سجّلت رفض — نتعلم منه' },
  };

  function _v2DbTimeAgo(iso){
    if (!iso) return '';
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'قبل لحظات';
    if (diff < 3600) return 'قبل ' + Math.floor(diff / 60) + ' دقيقة';
    if (diff < 86400) return 'قبل ' + Math.floor(diff / 3600) + ' ساعة';
    if (diff < 86400 * 7) return 'قبل ' + Math.floor(diff / 86400) + ' يوم';
    return new Date(iso).toLocaleDateString('ar-SA');
  }

  // ── #/dashboard main renderer ─────────────────────────────────────────
  function renderDashboard(el, route){
    if (typeof DarbiJourney === 'undefined') {
      el.innerHTML = '<div class="v2-jobs-error"><span>⚠</span><div>لوحة المتابعة غير متوفرة.</div></div>';
      return;
    }
    var diagnosis = (typeof Diagnosis !== 'undefined' && Diagnosis.get) ? Diagnosis.get() : null;
    var stats = (typeof Applications !== 'undefined' && Applications.stats) ? Applications.stats() : { total: 0 };
    var nextAction = DarbiJourney.getNextAction();
    var progress = DarbiJourney.progress();

    // ── First-time empty state ──
    // If user has no diagnosis AND no applications, show the friendly hero
    // pointing them straight to the journey start. No placeholder cells.
    if (!diagnosis && stats.total === 0) {
      el.innerHTML = ''
        + '<div class="v2-db-empty">'
        +   '<div class="v2-db-empty-emoji">👋</div>'
        +   '<div class="v2-db-empty-h">أهلاً في دربي</div>'
        +   '<div class="v2-db-empty-sub">قبل أي شي ثاني، نسوي تشخيص سريع لوضعك المهني (دقيقة وحدة). بعدها كل شي بيتفصّل عليك.</div>'
        +   '<button class="v2-db-hero-cta" onclick="v2Go(\'#/track\')">ابدأ التشخيص ←</button>'
        + '</div>'
        + '<div class="v2-db-section">'
        +   '<div class="v2-db-section-h">المسار الكامل</div>'
        +   _v2DbRenderRoadmap(progress)
        + '</div>';
      return;
    }

    // ── Hero: next action ──
    var ctaRoute = V2_ROUTE_FOR_KEY[nextAction.key] || '#/track';
    var heroHtml = ''
      + '<div class="v2-db-hero">'
      +   '<div class="v2-db-hero-eyebrow">⚡ خطوتك التالية</div>'
      +   '<div class="v2-db-hero-h">' + escapeHtml(nextAction.title) + '</div>'
      +   '<div class="v2-db-hero-why">' + escapeHtml(nextAction.why) + '</div>'
      +   '<button class="v2-db-hero-cta" onclick="v2Go(\'' + escapeHtml(ctaRoute) + '\')">' + escapeHtml(nextAction.cta) + ' ←</button>'
      + '</div>';

    // ── Diagnosis card ──
    var dxHtml = '';
    if (diagnosis) {
      var seniorBand = diagnosis.isSeniorOverride ? 'senior'
                      : (diagnosis.intent && diagnosis.intent.inferredSeniority === 'fresh_grad') ? 'fresh' : null;
      var seniorCls = seniorBand === 'senior' ? ' is-senior' : seniorBand === 'fresh' ? ' is-fresh' : '';
      var seniorLabel = seniorBand === 'senior' ? 'مستوى قيادي' : seniorBand === 'fresh' ? 'حديث تخرّج' : 'في النمو';
      dxHtml = ''
        + '<div class="v2-db-section">'
        +   '<div class="v2-db-section-h"><span>🔎 تشخيصك</span><button class="v2-db-section-link" onclick="v2Go(\'#/diagnosis\')">افتح ←</button></div>'
        +   '<div class="v2-db-dx-role">' + escapeHtml(diagnosis.dreamRole || '—') + '</div>'
        +   '<div class="v2-db-dx-fam">' + escapeHtml(_v2DbFamilyName(diagnosis.family)) + '</div>'
        +   '<div class="v2-db-dx-row">'
        +     '<span class="v2-db-dx-pill' + seniorCls + '">' + escapeHtml(seniorLabel) + '</span>'
        +   '</div>'
        + '</div>';
    }

    // ── Weekly progress ──
    var weeklyHtml = '';
    if (stats.total > 0 && typeof _v2TrackerWeeklyStats === 'function') {
      var weekly = _v2TrackerWeeklyStats();
      var pct = Math.min(100, Math.round((weekly.thisWeek / weekly.target) * 100));
      var metCls = weekly.thisWeek >= weekly.target ? ' is-done' : '';
      weeklyHtml = ''
        + '<div class="v2-db-section">'
        +   '<div class="v2-db-section-h"><span>📊 تقدمك هذا الأسبوع</span><button class="v2-db-section-link" onclick="v2Go(\'#/tracker\')">تقديماتي ←</button></div>'
        +   '<div class="v2-db-weekly-row">'
        +     '<div><span class="v2-db-weekly-n">' + weekly.thisWeek + '</span>'
        +       ' <span class="v2-db-weekly-target">/ ' + weekly.target + ' هذا الأسبوع</span></div>'
        +     '<div class="v2-db-weekly-target">إجمالي: ' + weekly.total + '</div>'
        +   '</div>'
        +   '<div class="v2-iv-progress-bar"><div class="v2-iv-progress-bar-fill' + metCls + '" style="width:' + pct + '%"></div></div>'
        +   '<div class="v2-db-weekly-meta">' + (stats.interview > 0 ? 'فيها ' + stats.interview + ' مقابلة' : (stats.reply > 0 ? 'فيها ' + stats.reply + ' رد' : 'تابع التقديم بانتظام')) + '</div>'
        + '</div>';
    }

    // ── Roadmap ──
    var roadmapHtml = ''
      + '<div class="v2-db-section">'
      +   '<div class="v2-db-section-h">🗺 المسار</div>'
      +   _v2DbRenderRoadmap(progress)
      + '</div>';

    // ── Activity ──
    var activityHtml = '';
    if (typeof DarbiBrain !== 'undefined' && DarbiBrain.allEvents) {
      var events = DarbiBrain.allEvents();
      // Show last 5 *labeled* events (skip internal / unmapped types).
      var visible = events.filter(function(e){ return V2_DB_EVENT_LABELS[e.type]; }).slice(-5).reverse();
      if (visible.length) {
        var rows = visible.map(function(e){
          var L = V2_DB_EVENT_LABELS[e.type];
          return ''
            + '<li>'
            +   '<div class="v2-db-activity-emoji">' + L.emoji + '</div>'
            +   '<div class="v2-db-activity-text">' + escapeHtml(L.text) + '<div class="v2-db-activity-meta">' + escapeHtml(_v2DbTimeAgo(e.ts)) + '</div></div>'
            + '</li>';
        }).join('');
        activityHtml = ''
          + '<div class="v2-db-section">'
          +   '<div class="v2-db-section-h">📜 نشاطك الأخير</div>'
          +   '<ul class="v2-db-activity">' + rows + '</ul>'
          + '</div>';
      }
    }

    el.innerHTML = heroHtml + dxHtml + weeklyHtml + roadmapHtml + activityHtml;
  }

  // Roadmap list — done/current/locked. "current" = the first not-done step.
  function _v2DbRenderRoadmap(progress){
    var foundCurrent = false;
    var items = (progress || []).map(function(p){
      var state = 'locked';
      if (p.done) state = 'done';
      else if (!foundCurrent) { state = 'current'; foundCurrent = true; }
      var mark = state === 'done' ? '✓' : state === 'current' ? '◆' : '◯';
      var pill = state === 'done'
        ? '<span class="v2-db-roadmap-state is-done">تم</span>'
        : state === 'current'
          ? '<span class="v2-db-roadmap-state is-current">الآن</span>'
          : '';
      return ''
        + '<li class="' + (state === 'done' ? 'is-done' : '') + '">'
        +   '<div class="v2-db-roadmap-mark is-' + state + '">' + mark + '</div>'
        +   '<div class="v2-db-roadmap-label">' + escapeHtml(p.label) + '</div>'
        +   pill
        + '</li>';
    }).join('');
    return '<ul class="v2-db-roadmap">' + items + '</ul>';
  }
  </script>

</body>
</html>
